name: Forex — Python + Telegram tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify Telegram library
        run: |
          python -c 'import telegram; print("python-telegram-bot:", telegram.__version__)'
          python -c 'from telegram.ext import Application, JobQueue; print("Telegram imports: OK")'

      - name: Run all available tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q
        
